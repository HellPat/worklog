[package]
name = "team-up"
version = "0.2.1"
edition = "2024"

[dependencies]
anyhow = "=1.0.102"
chrono = { version = "=0.4.44", features = ["serde"] }
eframe = "=0.37.0"
egui_native_look = "=0.2.0"
tray-icon = "=0.26.1"
global-hotkey = "=0.9.0"
cpal = "=0.18.2"
rfd = "=0.17.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.22.0", features = ["v4", "serde"] }
tungstenite = "=0.28.0"
hound = "=3.5.1"
tempfile = "=3.26.0"
sonora = "=0.3.0"

[dev-dependencies]
egui_system_font_provider = "=0.37.0"
egui_kittest = { version = "=0.37.0", features = ["eframe"] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
