[package]
name = "team-up-gpui-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui-kit = "=0.9.1"
anyhow = "1"
gpui-kit-assets = "=0.9.1"
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
serde_json = "1"
xa11y = { version = "=0.15.4", default-features = false }
tempfile = "3"
cucumber = "0.22"

[[test]]
name = "ui"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
