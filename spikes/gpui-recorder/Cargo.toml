[package]
name = "team-up-gpui-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gpui-kit = "=0.9.1"
# Renderer frame readback for in-memory blurred modal backdrops.
gpui-capture = { package = "gpui-pre-platform", version = "=0.3.12", features = ["test-support"] }
anyhow = "1"
image = { version = "=0.25.10", default-features = false }
cpal = "=0.18.2"
tray-icon = { version = "=0.26.1", default-features = false }
gpui-kit-assets = "=0.9.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tungstenite = "=0.28.0"
hound = "=3.5.1"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
sonora = "=0.3.0"
gcf = "=3.0.1"
clap = { version = "=4.6.7", features = ["derive"] }
base64 = "=0.22.1"

[dev-dependencies]
serde_json = "1"
xa11y = { version = "=0.15.4", default-features = false }
cucumber = "0.22"

[[test]]
name = "ui"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
